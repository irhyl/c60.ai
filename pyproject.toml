[project]
name = "c60-ai"
version = "0.2.0"
description = "AutoML via molecular evolution — represents ML pipelines as typed DAGs and evolves them with genetic algorithms."
authors = [
    { name = "Aditi Ramakrishnan", email = "aditirkrishna@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "automl", "machine-learning", "evolutionary-algorithms",
    "graph", "genetic-programming", "neuro-symbolic",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ---------------------------------------------------------------------------
# Runtime dependencies (Phase 1 — core data structures)
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scikit-learn>=1.0",
    "scipy>=1.8",
    "networkx>=2.6",
    "joblib>=1.1",
    "tqdm>=4.62",
    "pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# Development + testing
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "isort>=5.10",
    "pre-commit>=3.0",
    "matplotlib>=3.5",
    "seaborn>=0.11",
]

# Phase 7 — neural / HybridNode
neural = [
    "torch>=2.0",
    "torch-geometric>=2.3",
]

# Phase 9 — distributed evaluation
distributed = [
    "ray[default]>=2.0",
]

# Phase 9 — REST API
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
]

# Everything
all = [
    "c60-ai[dev,neural,distributed,api]",
]

# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/c60"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "test"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
